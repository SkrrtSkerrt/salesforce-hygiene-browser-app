name: Browser app feedback

description: Report a general browser-app issue without sharing Salesforce metadata or sensitive material.
title: "[Browser app feedback]: "
labels:
  - browser-app-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not paste metadata, source code, org IDs, emails, customer names, screenshots, logs, credentials, tokens, URLs, report content, finding details, filenames, or local paths.

        Describe the issue in general terms only. If the problem involves unsupported metadata, name the metadata type category without copying the metadata body.
  - type: dropdown
    id: category
    attributes:
      label: Feedback category
      options:
        - Unsupported metadata type
        - False positive category
        - False negative category
        - Report readability
        - Browser compatibility
        - Documentation or wording
        - Other general feedback
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: General summary
      description: General description only. Do not include Salesforce metadata, source code, org identifiers, filenames, report content, or screenshots.
      placeholder: "Example: a validation-rule-style case was not classified the way expected, but do not paste the metadata."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: Browser name/version only. Do not include org, path, account, or environment identifiers.
      placeholder: "Example: Firefox 142"
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I did not include metadata, source code, org IDs, emails, customer names, screenshots, logs, credentials, tokens, URLs, report content, finding details, filenames, or local paths.
          required: true
